<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acceso privado a la agenda financiera">
    <title>Acceso | {{ project_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_version) }}">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <span class="login-mark" aria-hidden="true">F</span>
            <h1 id="login-title">Entra a Finanzas</h1>
            <p class="login-copy">Tu agenda personal de dinero.</p>

            {% if error %}
            <p class="message error" role="alert">{{ error }}</p>
            {% endif %}
            {% if not catalog_ready %}
            <p class="message error" role="alert">Configura el acceso con scripts/bootstrap_auth.py antes de iniciar sesión.</p>
            {% endif %}

            <form method="post" class="stack-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next_url }}">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" value="{{ login_username }}" autocomplete="username" required readonly>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
                <button class="primary-button" type="submit">Continuar</button>
            </form>
        </section>
    </main>
</body>
</html>
