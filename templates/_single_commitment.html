<details id="deuda-recurrente-{{ item.id }}" class="expense-category-editor debt-editor single-payment-debt">
    <summary><span><strong>{{ item.title }}</strong></span><b>{{ item.remaining }}</b><span class="debt-collection-actions">
        {% if item.remaining_cents and item.is_active %}<button class="secondary-button pay-action" type="submit" form="pay-single-commitment-{{ item.id }}">Pagar</button>{% endif %}
        {{ edit_button('title') }}
        <button class="secondary-button danger-button" type="submit" form="delete-single-commitment-{{ item.id }}" onclick="event.stopPropagation(); return confirm('¿Eliminar esta deuda? Los movimientos registrados se conservarán.')">Eliminar</button>
    </span></summary>
    <form id="pay-single-commitment-{{ item.id }}" method="post" data-single-submit action="{{ url_for('pay_commitment', commitment_id=item.id) }}" hidden>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="occurrence_on" value="{{ item.starts_on }}"><input type="hidden" name="occurred_on" value="{{ today }}"><input type="hidden" name="amount" value="{{ '%.2f'|format(item.remaining_cents / 100) }}">
    </form>
    <form id="delete-single-commitment-{{ item.id }}" method="post" action="{{ url_for('delete_commitment', commitment_id=item.id) }}" hidden><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"></form>
    <form class="expense-category-form single-payment-form" method="post" action="{{ url_for('edit_commitment', commitment_id=item.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="frequency" value="once"><input type="hidden" name="starts_on" value="{{ item.starts_on }}"><input type="hidden" name="category" value="{{ item.category }}"><input type="hidden" name="notes" value="{{ item.notes }}">
        <label>¿A quién le debes?<input name="title" value="{{ item.title }}" maxlength="120" required></label>
        <label>Monto total<input name="amount" type="number" min="0.01" max="999999999.99" step="0.01" inputmode="decimal" value="{{ '%.2f'|format(item.amount_cents / 100) }}" required></label>
        <div class="commitment-form-actions"><button class="secondary-button" type="submit">Guardar</button></div>
    </form>
</details>
