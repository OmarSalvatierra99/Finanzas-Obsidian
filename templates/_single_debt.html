<details id="deuda-{{ debt.id }}" class="expense-category-editor debt-editor single-payment-debt">
    <summary><span><strong>{{ debt.creditor }}</strong></span><b>{{ debt.balance }}</b><span class="debt-collection-actions">
        {% if debt.balance_cents %}<button class="secondary-button pay-action" type="submit" form="pay-single-debt-{{ debt.id }}">Pagar</button>{% endif %}
        {{ edit_button() }}
        <button class="secondary-button danger-button" type="submit" form="delete-debt-{{ debt.id }}" onclick="event.stopPropagation(); return confirm('¿Eliminar esta deuda? Los movimientos registrados se conservarán.')">Eliminar</button>
    </span></summary>
    <form id="pay-single-debt-{{ debt.id }}" method="post" data-single-submit action="{{ url_for('pay_single_debt', debt_id=debt.id) }}" hidden>
        {{ context_fields() }}<input type="hidden" name="expected_balance" value="{{ debt.balance_cents }}">
    </form>
    <form id="delete-debt-{{ debt.id }}" method="post" action="{{ url_for('delete_debt', debt_id=debt.id) }}" hidden>{{ context_fields() }}</form>
    <form class="expense-category-form single-payment-form" method="post" action="{{ url_for('edit_single_debt', debt_id=debt.id) }}">
        {{ context_fields() }}<input type="hidden" name="expected_balance" value="{{ debt.balance_cents }}">
        <label>¿A quién le debes?<input name="name" value="{{ debt.creditor }}" maxlength="100" required></label>
        <label>Cuánto falta por pagar<input name="amount" type="number" min="0" max="999999999.99" step="0.01" inputmode="decimal" value="{{ '%.2f'|format(debt.balance_cents / 100) }}" required></label>
        <div class="commitment-form-actions"><button class="secondary-button" type="submit">Guardar</button></div>
    </form>
</details>
