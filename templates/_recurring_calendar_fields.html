<input type="hidden" name="calendar_edit" value="1">
<fieldset class="recurring-calendar-fields">
    <legend>Calendario</legend>
    <label>Frecuencia<select name="frequency" data-recurring-frequency>
        {% for value, label in commitment_frequencies.items() if value != 'once' %}
        <option value="{{ value }}"{% if value == ('fortnightly' if item.pair_id else item.frequency) %} selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select></label>
    <label>Desde<input name="starts_on" type="date" value="{{ item.starts_on }}" required></label>
    <label data-weekly-calendar{% if item.frequency != 'weekly' or item.pair_id %} hidden{% endif %}>Día de la semana<select name="weekday">
        {% for label in ('Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo') %}<option value="{{ loop.index0 }}"{% if item.weekday == loop.index0 %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select></label>
    <label data-monthly-calendar{% if item.frequency != 'monthly' or item.pair_id %} hidden{% endif %}>Día del mes<input name="month_day" type="number" min="1" max="31" value="{{ item.month_day or 1 }}"></label>
    <small data-fortnightly-calendar{% if not item.pair_id %} hidden{% endif %}>Pagos los días 15 y 30 de cada mes.</small>
</fieldset>
