{% macro debt_progress(debt) %}
<span class="debt-progress">
    <span class="debt-progress-bar"><progress max="100" value="{{ debt.paid_percent }}" aria-label="{{ debt.paid_percent }}% pagado de {{ debt.creditor }}">{{ debt.paid_percent }}%</progress><span class="debt-progress-percent">{{ debt.paid_percent }}%</span></span>
    <small><span>{{ debt.paid }} pagado</span><strong>{{ debt.balance }} pendiente</strong></small>
</span>
{% endmacro %}
